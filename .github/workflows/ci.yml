name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Detect repository base branch
        id: base-branch
        run: python .github/scripts/detect_base_branch.py
      - name: Run CI on Linux and macOS
        if: steps.base-branch.outputs.run_ci == 'true' && runner.os != 'Windows'
        run: ./ci.sh
      - name: Run CI on Windows
        if: steps.base-branch.outputs.run_ci == 'true' && runner.os == 'Windows'
        run: ci.bat
        shell: cmd
      - uses: actions/upload-artifact@v4
        if: steps.base-branch.outputs.run_ci == 'true'
        with:
          name: hello-${{ matrix.os }}
          path: dist/
